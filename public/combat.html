<!DOCTYPE html>
<html>
<head>
    <title>Combat Grounds</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Combat Grounds</h1>

    <p id="playerInfo">Loading player...</p>

    <h2 id="enemyName">No enemy</h2>
    <p id="enemyHp"></p>

    <section id="enemySelection">
        <h3>Choose Enemy</h3>
        <div id="enemyList">Loading enemies...</div>
    </section>

    <br>

    <button id="attackButton">Attack</button>
    <button id="fleeButton">Flee</button>

    <h3>Combat Log</h3>
    <div id="combatLog"></div>

    <br>
    <button onclick="window.location.href='index.html'">
        Back to Town
    </button>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let gameConfig = null;
        let currentPlayer = null;

        socket.on("connect_error", () => {
            window.location.href = "login.html";
        });

        socket.on("playerData", (player) => {
            currentPlayer = player;
            document.getElementById("playerInfo").textContent =
                `${player.username} | HP: ${player.hp}/${player.maxHp} | Damage: ${player.damage} | Money: $${player.money}`;
            renderEnemies();
        });

        socket.on("gameConfig", (config) => {
            gameConfig = config;
            renderEnemies();
        });

        function startFight(enemyType) {
            socket.emit("startFight", enemyType);
        }

        function unlockEnemy(enemyType) {
            socket.emit("unlockEnemy", enemyType, (result) => {
                addCombatMessage(result.message);
            });
        }

        function addCombatMessage(message) {
            const logBox = document.getElementById("combatLog");
            const p = document.createElement("p");
            p.textContent = message;
            logBox.prepend(p);

            while (logBox.children.length > 10) {
                logBox.removeChild(logBox.lastChild);
            }
        }

        function setFightActive(isActive) {
            document.getElementById("enemySelection").hidden = isActive;
        }

        function renderEnemies() {
            if (!gameConfig || !currentPlayer) return;

            const enemyList = document.getElementById("enemyList");
            enemyList.innerHTML = "";

            Object.entries(gameConfig.enemies).forEach(([enemyType, enemy]) => {
                const unlocked = currentPlayer.unlockedEnemies.includes(enemyType);
                const recommended = currentPlayer.damage >= enemy.recommendedDamage
                    && currentPlayer.maxHp >= enemy.recommendedMaxHp;
                const card = document.createElement("div");
                card.className = "enemy-card";

                const heading = document.createElement("h3");
                heading.textContent = enemy.name;

                const stats = document.createElement("p");
                stats.textContent = `HP: ${enemy.hp} | Damage: ${enemy.damage} | Reward: $${enemy.rewardMoney}`;

                const guidance = document.createElement("p");
                guidance.textContent = `Suggested: ${enemy.recommendedDamage} damage and ${enemy.recommendedMaxHp} max HP — ${recommended ? "Ready" : "Challenging"}`;

                const button = document.createElement("button");

                if (unlocked) {
                    button.textContent = `Fight ${enemy.name}`;
                    button.addEventListener("click", () => startFight(enemyType));
                } else {
                    button.textContent = `Unlock ${enemy.name} ($${enemy.unlockCost})`;
                    button.addEventListener("click", () => unlockEnemy(enemyType));
                }

                card.append(heading, stats, guidance, button);
                enemyList.appendChild(card);
            });
        }

        document.getElementById("attackButton").addEventListener("click", () => {
            const attackButton = document.getElementById("attackButton");
            attackButton.disabled = true;

            socket.emit("attackEnemy", (result) => {
                setTimeout(() => {
                    attackButton.disabled = false;
                }, result.cooldownMs || 250);
            });
        });

        document.getElementById("fleeButton").addEventListener("click", () => {
            socket.emit("fleeFight", (result) => {
                if (result.success) {
                    document.getElementById("enemyName").textContent = "No enemy";
                    document.getElementById("enemyHp").textContent = "";
                }
            });
        });

        socket.on("fightUpdate", (fight) => {
            setFightActive(true);
            document.getElementById("enemyName").textContent = fight.enemy.name;
            document.getElementById("enemyHp").textContent =
                `Enemy HP: ${fight.enemy.hp}/${fight.enemy.maxHp}`;

            const logBox = document.getElementById("combatLog");
            logBox.innerHTML = "";

            fight.log.slice().reverse().forEach((message) => {
                const p = document.createElement("p");
                p.textContent = message;
                logBox.appendChild(p);
            });
        });

        socket.on("combatMessage", (message) => {
            addCombatMessage(message);
        });

        socket.on("fightEnded", (message) => {
            setFightActive(false);
            document.getElementById("enemyName").textContent = "No enemy";
            document.getElementById("enemyHp").textContent = "";
            document.getElementById("combatLog").innerHTML = `<p>${message}</p>`;
        });
    </script>
</body>
</html>
