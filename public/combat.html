<!DOCTYPE html>
<html>
<head>
    <title>Combat Grounds</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-shell">
        <header class="game-header">
            <p class="eyebrow">Adventurer's Journal</p>
            <h1>Combat Grounds</h1>
            <p class="subtitle">Pick a foe, watch the round-by-round log, and return to town when you need a rest.</p>
        </header>

        <div class="menu-frame">
            <aside class="side-panel">
                <section class="panel-section">
                    <h2>Your Character</h2>
                    <p id="playerInfo" class="stat-card">Loading player...</p>
                </section>

                <section class="panel-section">
                    <h2>Travel</h2>
                    <nav class="nav-list" aria-label="Game areas">
                        <button class="nav-button" onclick="window.location.href='index.html'">Town</button>
                        <button class="nav-button" onclick="window.location.href='training.html'">Training</button>
                        <button class="nav-button" onclick="window.location.href='work.html'">Work</button>
                        <button class="nav-button active" onclick="window.location.href='combat.html'">Combat</button>
                    </nav>
                </section>

                <button id="logoutButton" class="danger-button">Logout</button>
            </aside>

            <main class="main-panel">
                <section class="journal-card">
                    <h2>Current Fight</h2>
                    <div class="combat-readout">
                        <strong id="enemyName">No enemy</strong>
                        <span id="enemyHp"></span>
                    </div>

                    <div id="combatActions" class="combat-actions" hidden>
                        <button id="attackButton" class="action-button">Attack</button>
                        <button id="fleeButton" class="danger-button">Flee</button>
                    </div>
                    <button id="returnToEnemiesButton" class="action-button" hidden>Choose Another Enemy</button>
                </section>

                <section id="enemySelection" class="journal-card">
                    <h2>Choose Enemy</h2>
                    <div id="enemyList" class="enemy-grid">Loading enemies...</div>
                </section>

                <section class="journal-card">
                    <h2>Combat Log</h2>
                    <div id="combatLog"></div>
                </section>
            </main>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let gameConfig = null;
        let currentPlayer = null;
        const logoutButton = document.getElementById("logoutButton");

        socket.on("connect_error", () => {
            window.location.href = "login.html";
        });

        socket.on("playerData", (player) => {
            currentPlayer = player;
            document.getElementById("playerInfo").textContent =
                `${player.username} | HP: ${player.hp}/${player.maxHp} | Damage: ${player.damage} | Money: $${player.money}`;
            renderEnemies();
        });

        socket.on("gameConfig", (config) => {
            gameConfig = config;
            renderEnemies();
        });

        function startFight(enemyType) {
            socket.emit("startFight", enemyType);
        }

        function unlockEnemy(enemyType) {
            socket.emit("unlockEnemy", enemyType, (result) => {
                addCombatMessage(result.message);
            });
        }

        function addCombatMessage(message) {
            const logBox = document.getElementById("combatLog");
            const p = document.createElement("p");
            p.textContent = message;
            logBox.prepend(p);

            while (logBox.children.length > 10) {
                logBox.removeChild(logBox.lastChild);
            }
        }

        function showEnemySelection() {
            document.getElementById("enemySelection").hidden = false;
            document.getElementById("combatActions").hidden = true;
            document.getElementById("returnToEnemiesButton").hidden = true;
            document.getElementById("enemyName").textContent = "No enemy";
            document.getElementById("enemyHp").textContent = "";
        }

        function showActiveFight() {
            document.getElementById("enemySelection").hidden = true;
            document.getElementById("combatActions").hidden = false;
            document.getElementById("returnToEnemiesButton").hidden = true;
        }

        function showFightResult() {
            document.getElementById("enemySelection").hidden = true;
            document.getElementById("combatActions").hidden = true;
            document.getElementById("returnToEnemiesButton").hidden = false;
        }

        function renderEnemies() {
            if (!gameConfig || !currentPlayer) return;

            const enemyList = document.getElementById("enemyList");
            enemyList.innerHTML = "";

            Object.entries(gameConfig.enemies).forEach(([enemyType, enemy]) => {
                const unlocked = currentPlayer.unlockedEnemies.includes(enemyType);
                const recommended = currentPlayer.damage >= enemy.recommendedDamage
                    && currentPlayer.maxHp >= enemy.recommendedMaxHp;
                const card = document.createElement("div");
                card.className = "enemy-card";

                const heading = document.createElement("h3");
                heading.textContent = enemy.name;

                const stats = document.createElement("p");
                stats.textContent = `HP: ${enemy.hp} | Damage: ${enemy.damage} | Reward: $${enemy.rewardMoney}`;

                const guidance = document.createElement("p");
                guidance.textContent = `Suggested: ${enemy.recommendedDamage} damage and ${enemy.recommendedMaxHp} max HP — ${recommended ? "Ready" : "Challenging"}`;

                const button = document.createElement("button");

                if (unlocked) {
                    button.textContent = `Fight ${enemy.name}`;
                    button.className = "action-button";
                    button.addEventListener("click", () => startFight(enemyType));
                } else {
                    button.textContent = `Unlock ${enemy.name} ($${enemy.unlockCost})`;
                    button.className = "action-button";
                    button.addEventListener("click", () => unlockEnemy(enemyType));
                }

                card.append(heading, stats, guidance, button);
                enemyList.appendChild(card);
            });
        }

        document.getElementById("attackButton").addEventListener("click", () => {
            const attackButton = document.getElementById("attackButton");
            attackButton.disabled = true;

            socket.emit("attackEnemy", (result) => {
                if (result.fightEnded) {
                    showFightResult();
                }

                setTimeout(() => {
                    attackButton.disabled = false;
                }, result.cooldownMs || 250);
            });
        });

        document.getElementById("fleeButton").addEventListener("click", () => {
            socket.emit("fleeFight", (result) => {
                if (result.success) {
                    showEnemySelection();
                }
            });
        });

        document.getElementById("returnToEnemiesButton").addEventListener("click", () => {
            showEnemySelection();
        });

        logoutButton.addEventListener("click", async () => {
            await fetch("/api/logout", { method: "POST" });
            socket.disconnect();
            window.location.href = "login.html";
        });

        socket.on("fightUpdate", (fight) => {
            showActiveFight();
            document.getElementById("enemyName").textContent = fight.enemy.name;
            document.getElementById("enemyHp").textContent =
                `Enemy HP: ${fight.enemy.hp}/${fight.enemy.maxHp}`;

            const logBox = document.getElementById("combatLog");
            logBox.innerHTML = "";

            fight.log.slice().reverse().forEach((message) => {
                const p = document.createElement("p");
                p.textContent = message;
                logBox.appendChild(p);
            });
        });

        socket.on("combatMessage", (message) => {
            addCombatMessage(message);
        });

        socket.on("fightEnded", (message) => {
            showEnemySelection();
            document.getElementById("combatLog").innerHTML = "";
            addCombatMessage(message);
        });
    </script>
</body>
</html>
