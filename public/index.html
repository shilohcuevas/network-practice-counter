<!DOCTYPE html>
<html>
<head>
    <title>Town Square</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Town Square</h1>

    <h2>Your Character</h2>
    <p id="characterInfo">Loading...</p>

    <h2>All Players</h2>
    <ul id="playerList"></ul>

    <button onclick="window.location.href='training.html'">
        Training Grounds
    </button>

    <button onclick="window.location.href='work.html'">
        Work
    </button>

    <button onclick="window.location.href='combat.html'">
        Combat Grounds
    </button>

    <h2>Inn</h2>
    <p id="healInfo">Rest and recover HP for $1 per HP.</p>

    <button id="healButton">
        Heal to Full
    </button>

<p id="healMessage"></p>

    <br><br>

    <button id="logoutButton">Logout</button>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        const characterInfo = document.getElementById("characterInfo");
        const playerList = document.getElementById("playerList");
        const logoutButton = document.getElementById("logoutButton");
        const healButton = document.getElementById("healButton");
        const healMessage = document.getElementById("healMessage");

        const username = localStorage.getItem("username");

        // If no username is saved, send player back to login
        if (!username) {
            window.location.href = "login.html";
        } else {
            socket.emit("loadPlayer", username);
        }

        // Display this player's saved character data
        socket.on("playerData", (player) => {
            characterInfo.textContent =
                `HP: ${player.hp}/${player.maxHp} - Damage: ${player.damage} - Money: $${player.money}`;
        });

        // Display all players
        socket.on("playersUpdate", (players) => {
            playerList.innerHTML = "";

            const playerArray = Object.values(players);

            playerArray.forEach((player) => {
                const listItem = document.createElement("li");
                listItem.textContent =
                    `HP: ${player.hp}/${player.maxHp} - Damage: ${player.damage} - Money: $${player.money}`;
                playerList.appendChild(listItem);
            });
        });

        socket.on("healMessage", (message) => {
            healMessage.textContent = message;
        });

        // If account no longer exists, return to login
        socket.on("notLoggedIn", () => {
            localStorage.removeItem("username");
            window.location.href = "login.html";
        });

        // Log out locally and on the server
        logoutButton.addEventListener("click", () => {
            localStorage.removeItem("username");
            socket.emit("logout");
            window.location.href = "login.html";
        });

        healButton.addEventListener("click", () => {
            socket.emit("healPlayer");
        });
    </script>

</body>
</html>
