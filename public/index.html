<!DOCTYPE html>
<html>
<head>
    <title>Town Square</title>
</head>
<body>

    <h1>Town Square</h1>

    <h2>Your Character</h2>
    <p id="characterInfo">Loading...</p>

    <h2>All Players</h2>
    <ul id="playerList"></ul>

    <button onclick="window.location.href='training.html'">
        Training Grounds
    </button>

    <br><br>

    <button id="logoutButton">Logout</button>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        const characterInfo = document.getElementById("characterInfo");
        const playerList = document.getElementById("playerList");
        const logoutButton = document.getElementById("logoutButton");

        const username = localStorage.getItem("username");

        if (!username) {
            window.location.href = "login.html";
        } else {
            socket.emit("loadPlayer", username);
        }

        socket.on("playerData", (player) => {
            characterInfo.textContent = `${player.username} - Damage: ${player.damage}`;
        });

        socket.on("playersUpdate", (players) => {
            playerList.innerHTML = "";

            const playerArray = Object.values(players);

            playerArray.forEach((player) => {
                const listItem = document.createElement("li");
                listItem.textContent = `${player.username} - Damage: ${player.damage}`;
                playerList.appendChild(listItem);
            });
        });

        socket.on("notLoggedIn", () => {
            localStorage.removeItem("username");
            window.location.href = "login.html";
        });

        logoutButton.addEventListener("click", () => {
            localStorage.removeItem("username");
            socket.emit("logout");
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
