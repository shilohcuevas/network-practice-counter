<!DOCTYPE html>
<html>
<head>
    <title>Training Grounds</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Training Grounds</h1>

    <h2>Your Character</h2>
    <p id="characterInfo">Loading...</p>

    <button id="trainButton">Train Damage</button>
    <button id="trainHealthButton">
        Train Health
    </button>

    <p id="trainingMessage"></p>

    <br><br>

    <button onclick="window.location.href='index.html'">
        Return to Town
    </button>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        const characterInfo = document.getElementById("characterInfo");
        const trainButton = document.getElementById("trainButton");
        const trainHealthButton = document.getElementById("trainHealthButton");
        const trainingMessage = document.getElementById("trainingMessage");
        let currentPlayer = null;
        let gameConfig = null;

        socket.on("connect_error", () => {
            window.location.href = "login.html";
        });

        // Display current character stats
        socket.on("playerData", (player) => {
            currentPlayer = player;
            characterInfo.textContent =
                `HP: ${player.hp}/${player.maxHp} - Damage: ${player.damage} - Money: $${player.money}`;
            updateTrainingLabels();
        });

        socket.on("gameConfig", (config) => {
            gameConfig = config;
            updateTrainingLabels();
        });

        // Return to login if player is invalid
        socket.on("notLoggedIn", () => {
            window.location.href = "login.html";
        });

        function updateTrainingLabels() {
            if (!currentPlayer || !gameConfig) return;

            const damageCost = currentPlayer.damage * gameConfig.damageTrainingMultiplier;
            const healthCost = Math.max(1, currentPlayer.maxHp - gameConfig.healthTrainingOffset);
            trainButton.textContent = `Train Damage ($${damageCost})`;
            trainHealthButton.textContent = `Train Health ($${healthCost})`;
        }

        function applyCooldown(button, milliseconds) {
            button.disabled = true;
            button.textContent = "Training...";

            setTimeout(() => {
                button.disabled = false;
                updateTrainingLabels();
            }, milliseconds);
        }

        trainButton.addEventListener("click", () => {
            trainButton.disabled = true;
            socket.emit("trainDamage", (result) => {
                trainingMessage.textContent = result.message;
                applyCooldown(trainButton, result.cooldownMs || 250);
            });
        });

        trainHealthButton.addEventListener("click", () => {
            trainHealthButton.disabled = true;
            socket.emit("trainHealth", (result) => {
                trainingMessage.textContent = result.message;
                applyCooldown(trainHealthButton, result.cooldownMs || 250);
            });
        });
    </script>

</body>
</html>
