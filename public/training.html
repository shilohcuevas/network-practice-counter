<!DOCTYPE html>
<html>
<head>
    <title>Training Grounds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Training Grounds</h1>

    <h2>Your Character</h2>
    <p id="characterInfo">Loading...</p>

    <button id="trainButton">Train Damage</button>

    <br><br>

    <button onclick="window.location.href='index.html'">
        Return to Town
    </button>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        const characterInfo = document.getElementById("characterInfo");
        const trainButton = document.getElementById("trainButton");

        const username = localStorage.getItem("username");

        // Load same character after page change
        if (!username) {
            window.location.href = "login.html";
        } else {
            socket.emit("loadPlayer", username);
        }

        // Display current character stats
        socket.on("playerData", (player) => {
            characterInfo.textContent =
                `${player.username} - Damage: ${player.damage} - Money: $${player.money}`;
        });

        // Return to login if player is invalid
        socket.on("notLoggedIn", () => {
            localStorage.removeItem("username");
            window.location.href = "login.html";
        });

        // Train damage and apply cooldown
        trainButton.addEventListener("click", () => {
            socket.emit("trainDamage");

            trainButton.disabled = true;
            trainButton.textContent = "Training...";

            setTimeout(() => {
                trainButton.disabled = false;
                trainButton.textContent = "Train Damage";
            }, 5000);
        });
    </script>

</body>
</html>
