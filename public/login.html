<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-card">
            <p class="eyebrow">Adventurer's Journal</p>
            <h1>Login / Register</h1>
            <p class="subtitle">Enter the town square and continue building your character.</p>

            <div class="field-group">
                <input id="usernameInput" placeholder="Username" autocomplete="username">
                <input id="passwordInput" placeholder="Password" type="password" autocomplete="current-password">
            </div>

            <div class="button-row">
                <button id="registerButton">Register</button>
                <button id="loginButton">Login</button>
            </div>

            <p id="message" class="message"></p>
        </section>
    </main>

    <script>
        const usernameInput = document.getElementById("usernameInput");
        const passwordInput = document.getElementById("passwordInput");
        const registerButton = document.getElementById("registerButton");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        async function authenticate(endpoint) {
            registerButton.disabled = true;
            loginButton.disabled = true;
            message.textContent = "Please wait...";

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: usernameInput.value,
                        password: passwordInput.value
                    })
                });
                const result = await response.json();

                message.textContent = result.message;

                if (result.success) {
                    window.location.href = "index.html";
                }
            } catch (error) {
                message.textContent = "Unable to reach the server.";
            } finally {
                registerButton.disabled = false;
                loginButton.disabled = false;
            }
        }

        registerButton.addEventListener("click", () => authenticate("/api/register"));
        loginButton.addEventListener("click", () => authenticate("/api/login"));

        passwordInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") authenticate("/api/login");
        });
    </script>

</body>
</html>
