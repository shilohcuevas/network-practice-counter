<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Login / Register</h1>

    <input id="usernameInput" placeholder="Username">
    <br><br>

    <input id="passwordInput" placeholder="Password" type="password">
    <br><br>

    <button id="registerButton">Register</button>
    <button id="loginButton">Login</button>

    <p id="message"></p>

    <script>
        const usernameInput = document.getElementById("usernameInput");
        const passwordInput = document.getElementById("passwordInput");
        const registerButton = document.getElementById("registerButton");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        async function authenticate(endpoint) {
            registerButton.disabled = true;
            loginButton.disabled = true;
            message.textContent = "Please wait...";

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: usernameInput.value,
                        password: passwordInput.value
                    })
                });
                const result = await response.json();

                message.textContent = result.message;

                if (result.success) {
                    window.location.href = "index.html";
                }
            } catch (error) {
                message.textContent = "Unable to reach the server.";
            } finally {
                registerButton.disabled = false;
                loginButton.disabled = false;
            }
        }

        registerButton.addEventListener("click", () => authenticate("/api/register"));
        loginButton.addEventListener("click", () => authenticate("/api/login"));

        passwordInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") authenticate("/api/login");
        });
    </script>

</body>
</html>
