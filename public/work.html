<!DOCTYPE html>
<html>
<head>
    <title>Work</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Work</h1>

    <h2>Your Character</h2>
    <p id="characterInfo">Loading...</p>

    <button id="workButton">Work Job</button>

    <p id="workMessage"></p>

    <br><br>

    <button onclick="window.location.href='index.html'">
        Return to Town
    </button>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        const characterInfo = document.getElementById("characterInfo");
        const workButton = document.getElementById("workButton");
        const workMessage = document.getElementById("workMessage");
        let workReward = 0;

        socket.on("connect_error", () => {
            window.location.href = "login.html";
        });

        // Display current character stats
        socket.on("playerData", (player) => {
            characterInfo.textContent =
                `HP: ${player.hp}/${player.maxHp} - Damage: ${player.damage} - Money: $${player.money}`;
        });

        // Return to login if player is invalid
        socket.on("notLoggedIn", () => {
            window.location.href = "login.html";
        });

        socket.on("gameConfig", (config) => {
            workReward = config.workReward;
            workButton.textContent = `Work Job (+$${workReward})`;
        });

        workButton.addEventListener("click", () => {
            workButton.disabled = true;
            workButton.textContent = "Working...";
            socket.emit("workJob", (result) => {
                workMessage.textContent = result.message;

                setTimeout(() => {
                    workButton.disabled = false;
                    workButton.textContent = `Work Job (+$${workReward})`;
                }, result.cooldownMs || 250);
            });
        });
    </script>

</body>
</html>
