<!DOCTYPE html>
<html>
<head>
    <title>Work</title>
</head>
<body>

    <h1>Work</h1>

    <h2>Your Character</h2>
    <p id="characterInfo">Loading...</p>

    <button id="workButton">Work Job</button>

    <br><br>

    <button onclick="window.location.href='index.html'">
        Return to Town
    </button>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        const characterInfo = document.getElementById("characterInfo");
        const workButton = document.getElementById("workButton");

        const username = localStorage.getItem("username");

        // Load same character after page change
        if (!username) {
            window.location.href = "login.html";
        } else {
            socket.emit("loadPlayer", username);
        }

        // Display current character stats
        socket.on("playerData", (player) => {
            characterInfo.textContent =
                `${player.username} - Damage: ${player.damage} - Money: $${player.money}`;
        });

        // Return to login if player is invalid
        socket.on("notLoggedIn", () => {
            localStorage.removeItem("username");
            window.location.href = "login.html";
        });

        // Work job gives money and applies cooldown
        workButton.addEventListener("click", () => {
            socket.emit("workJob");

            workButton.disabled = true;
            workButton.textContent = "Working...";

            setTimeout(() => {
                workButton.disabled = false;
                workButton.textContent = "Work Job";
            }, 5000);
        });
    </script>

</body>
</html>
